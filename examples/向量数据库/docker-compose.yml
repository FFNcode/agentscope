name: qdrant

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API 端口
      - "6334:6334"  # gRPC 端口
    volumes:
      # 映射数据目录到本地，实现数据持久化
      - ~/data/qdrant_data:/qdrant/storage
      # 可选：映射配置目录
      - ./qdrant_config:/qdrant/config
    environment:
      # Qdrant 服务配置
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      # 日志级别（可选）
      # - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: qdrant-network

